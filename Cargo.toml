[package]
name = "qdte"
version = "0.1.0"
edition = "2021"
authors = ["Sarang Community"]
description = "Quick & Dirty Text Editor — a terminal-based text editor"
license = "GPL-3.0-only"
repository = ""
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
toml = "0.8"
ropey = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
once_cell = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"