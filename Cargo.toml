[package]
name = "sarang-qdte"
version = "0.1.0"
edition = "2021"
authors = ["Sarang Community"]
description = "Quick & Dirty Text Editor — a terminal-based text editor"
license = "GPL-3.0-only"
repository = ""
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = "z"      # kecil
lto = true
codegen-units = 1
strip = "symbols"